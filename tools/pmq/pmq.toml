# 所有主檔路徑只寫在這裡（規格書 §1.1）。主檔搬家時只改這個檔。
# 相對路徑以 root 為基準；~ 會展開。

[paths]
root       = "~/Library/Mobile Documents/com~apple~CloudDocs/後醫/08_考古題與模擬考/82_考題整理"
physics    = "01_題庫製作/物理"
biochem    = "01_題庫製作/生化"
notes      = "02_學習筆記"
structure_db_out = "structure_db/out"
structure_db_src = "~/Projects/structure_db"
# 後醫、私醫、後獸醫原卷與答案 PDF（生化答案抽查用；只讀）
exam_pdfs  = "~/Library/Mobile Documents/com~apple~CloudDocs/後醫/08_考古題與模擬考/81_考古題"
content_git = "~/Projects/postmed-content.git"
# pmq backup pull 把個人資料整包存到這裡（規格書 §7.1），只留最近 8 份
backup_dir = "99_封存/題庫網備份"
cache      = "~/Library/Caches/postmed-qbank"

[sample]
# 給介面開發用的兩份筆記（相對 notes）
kb_biochem = "02_生化/B2_代謝篇/2-3_PDH_TCA_and_Glyoxylate_Cycle.md"
kb_physics = "03_物理/2_電磁學/Ch12動電學.md"

[kb]
# 資料庫（講義筆記，規格書 §9.4、搬遷步驟 9）。路徑相對 notes。_archive、pdf 資料夾一律不匯入。
# 匯入內容：每個子資料夾是一個群組（B1_基礎篇…）；直接放在這層的 .md 歸到「總論」
BCH = ["02_生化"]
PHY = ["03_物理"]
# 第 8C 階段（2026-11-12）：英文匯入旋元佑 B1 文法講義（05_英文/旋元佑_B1文法/，一章一份）。
# 版權由使用者自行負責；網站要公開分享時，把這一行改回 ENG = "05_英文"（只建目錄）再發佈，講義就會從網站消失。
ENG = ["05_英文"]
# 不匯入的檔（相對 notes）
# 05_英文 最上層的兩份：「_講解」是 25 章合併成一份的版本（與資料夾裡的分章檔重複）；「2026_英文_B1_文法」是舊版筆記
exclude = ["02_生化/00_待確認清單.md", "03_物理/特訓班_章節配對表.md",
           "05_英文/旋元佑_B1文法_講解.md", "05_英文/2026_英文_B1_文法.md",
           "05_英文/旋元佑_B1文法/2026_英文_B1_文法.md"]
# 第 8C 階段：筆記 ↔ 題目章節。檔名對到的筆記，頁首會有「這一章的題目」，題目的「相關筆記」會列出它。
# pattern 是檔名（不含 .md）的正規式，第一組是章號；chapter 是題目章節的代碼（n ＝ 章號）。
chapter_docs = { ENG = { pattern = "^Ch(\\d+)_", chapter = "ENG:G{n:02d}" } }
# 只建章節目錄（資料夾名稱當章節名）
BIO = "01_生物"
CHE = "04_化學"

[site]
# 第一次部署後，把 workers.dev 網址填在這裡（docs/部署步驟.md）。也可用環境變數 PMQ_URL 或 --url 覆寫。
url = "https://postmed-qbank.jimmyni312.workers.dev"

[anki]
# 第 5 階段：pmq anki import 預設匯入的牌組（含子牌組；2026-11-11 使用者決定，docs/第5階段_Anki檢查報告.md）。
# 指令列用 --deck 指定時以指令列為準。
import = [
  "05_English::1_高中核心6000單",
  "05_English::2_補習班講義",
  "05_English::3_GRE紅寶書",
  "05_English::4_TOEIC",
  "03_Physics::Ch0 Math, Constants & Units",
  "03_Physics::Ch01 一維運動", "03_Physics::Ch02 二維運動", "03_Physics::Ch03 牛頓三定律之應用",
  "03_Physics::Ch04 功與能", "03_Physics::Ch05 質心運動及動量守恆", "03_Physics::Ch06 轉動與滾動",
  "03_Physics::Ch07 震盪", "03_Physics::Ch08 重力場及重力位能", "03_Physics::Ch09 電場",
  "03_Physics::Ch10 電位能與電位", "03_Physics::Ch11 電容器與電容", "03_Physics::Ch12 動電學",
  "03_Physics::Ch13 磁場", "03_Physics::Ch14 載流導線四周建立磁場", "03_Physics::Ch29 特殊相對論",
  "03_Physics::Ch30 量子物理",
  "03_Physics::Other Resources::公式整理",
]

# 第 8B-1 階段：這些筆記類型匯成單字卡（kind = "vocab"，保留 11 個欄位；規格書 §9.11）。
# 網站上的單字卡樣板、匯出回 Anki 的筆記類型都以「0_後醫單字基本型」為準（tools/pmq/pmq/anki_models/vocab/）。
vocab_models = ["0_後醫單字基本型"]

# Anki 最上層牌組 → 網站科目
[anki.subjects]
"01_Biology" = "BIO"
"02_Biochemistry" = "BCH"
"03_Physics" = "PHY"
"04_Chemistry" = "CHE"
"05_English" = "ENG"

# 欄位的小標題（空字串＝不加標題）。背面第一個欄位一律不加。
[anki.labels]
"Extra" = "補充"
"Back Extra" = "補充"
"Source" = "出處"
"Image" = ""
"Back" = ""

# 個別筆記類型：正面放哪些欄位、背面依序放哪些欄位、欄位的小標題。沒列的類型照 Anki 樣板自動判斷。
[anki.models."0_後醫單字基本型"]
front = ["Word"]
# 背面的順序照使用者 Anki 樣板（2026-11-12 第 8B-1 階段改成與樣板相同；網站 app/src/data/card-core.ts 的 VOCAB_BACK 也是這個順序）
back = ["Part of Speech", "Meaning and Definition", "Sentence", "Derivative", "Memo & Confusable",
        "Synonyms", "Antonyms", "Prefix & Roots", "Image", "Source"]

[anki.models."0_後醫單字基本型".labels]
"Part of Speech" = ""
"Meaning and Definition" = ""
"Sentence" = "例句"
"Memo & Confusable" = "辨析"
"Derivative" = "衍生字"
"Synonyms" = "同義字"
"Antonyms" = "反義字"
"Prefix & Roots" = "字根字首"

# 第 8B-2 階段：查單字與單字索引（規格書 §9.11「8B」）。發佈時替這些科目產生單字索引；網站的「查單字」也只在這些科目出現。
[vocab]
subjects = ["ENG"]

# 第 8A 階段：「共用格式」的科目（英文；之後生物、化學的新題庫也加在這裡，app/ 與 worker/ 不用改）。
# 主檔格式見 01_題庫製作/共用規格/README.md；轉接器 tools/pmq/pmq/adapters/shared.py，唯讀。
[subjects.ENG]
name = "英文"
format = "shared"
path = "01_題庫製作/英文"
id_pattern = "^ENG-\\d{6}$"
# 第 8C 階段：文法章節（ENG:G01–G25，旋元佑 B1 文法 Ch01–Ch25）掛在 EN02 文法底下。
# 分類檔只放考古題；講義題（book.chapter）直接用它所在的章。檔案格式見 tools/pmq/pmq/adapters/shared.py 的 load_xchap。
xchap_file = "01_來源索引/grammar_chapters.json"
xchap_parent = "EN02"

# 2026-11-12：化學、生物（共用格式，和英文同一個轉接器）。題目瀏覽的「整份考卷」靠它們把物理化學、生物生化合卷。
[subjects.CHE]
name = "化學"
format = "shared"
path = "01_題庫製作/化學"
id_pattern = "^CHE-\\d{6}$"

[subjects.BIO]
name = "生物"
format = "shared"
path = "01_題庫製作/生物"
id_pattern = "^BIO-\\d{6}$"
