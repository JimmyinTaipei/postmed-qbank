# 所有主檔路徑只寫在這裡（規格書 §1.1）。主檔搬家時只改這個檔。
# 相對路徑以 root 為基準；~ 會展開。

[paths]
root       = "~/Library/Mobile Documents/com~apple~CloudDocs/後醫/08_考古題與模擬考/82_考題整理"
physics    = "01_題庫製作/物理"
biochem    = "01_題庫製作/生化"
notes      = "02_學習筆記"
structure_db_out = "structure_db/out"
structure_db_src = "~/Projects/structure_db"
# 後醫、私醫、後獸醫原卷與答案 PDF（生化答案抽查用；只讀）
exam_pdfs  = "~/Library/Mobile Documents/com~apple~CloudDocs/後醫/08_考古題與模擬考/81_考古題"
content_git = "~/Projects/postmed-content.git"
# pmq backup pull 把個人資料整包存到這裡（規格書 §7.1），只留最近 8 份
backup_dir = "99_封存/題庫網備份"
cache      = "~/Library/Caches/postmed-qbank"

[sample]
# 給介面開發用的兩份筆記（相對 notes）
kb_biochem = "02_生化/B2_代謝篇/2-3_PDH_TCA_and_Glyoxylate_Cycle.md"
kb_physics = "03_物理/2_電磁學/Ch12動電學.md"

[kb]
# 資料庫（講義筆記，規格書 §9.4、搬遷步驟 9）。路徑相對 notes。_archive、pdf 資料夾一律不匯入。
# 匯入內容：每個子資料夾是一個群組（B1_基礎篇…）；直接放在這層的 .md 歸到「總論」
BCH = ["02_生化"]
PHY = ["03_物理"]
# 不匯入的檔（相對 notes）
exclude = ["02_生化/00_待確認清單.md", "03_物理/特訓班_章節配對表.md"]
# 只建章節目錄（資料夾名稱當章節名）
BIO = "01_生物"
CHE = "04_化學"
ENG = "05_英文"

[site]
# 第一次部署後，把 workers.dev 網址填在這裡（docs/部署步驟.md）。也可用環境變數 PMQ_URL 或 --url 覆寫。
url = ""
